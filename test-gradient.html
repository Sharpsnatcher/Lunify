<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест градиента</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        }
        .test-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .voice-section {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="voice-section">
            <button class="voice-button" id="voiceBtn">🎤</button>
            <div class="voice-status" id="voiceStatus">Нажмите для записи</div>
            <div class="voice-hint">Расскажите, как вы себя чувствуете</div>
        </div>
    </div>

    <script>
        // Тест переключения состояния записи
        const btn = document.getElementById('voiceBtn');
        const status = document.getElementById('voiceStatus');
        let isRecording = false;

        btn.addEventListener('click', () => {
            isRecording = !isRecording;
            if (isRecording) {
                btn.classList.add('recording');
                status.classList.add('recording');
                status.textContent = 'Идет запись...';
            } else {
                btn.classList.remove('recording');
                status.classList.remove('recording');
                status.textContent = 'Нажмите для записи';
            }
        });
    </script>
</body>
</html>
